<style>
/* Layout: one phone-width column. Sticky header, lead list, a fixed scan button at the thumb. Square corners, Red Argyle tokens. */
:root {
  --bg: #FAFBFB;          /* ra-salt */
  --surface: #FFFFFF;     /* ra-paper */
  --fg: #191919;          /* ra-charcoal-deep */
  --fg-muted: #2C2C31;    /* ra-charcoal */
  --fg-subtle: #4e4e4e;
  --line: rgba(25, 25, 25, 0.10);
  --hairline: #11103B;    /* ra-ink */
  --red: #EE2E24;         /* ra-red, marks only */
  --red-solid: #CB1910;   /* ra-red-accessible, fills under white text */
  --on-red: #FFFFFF;
  --hot-bg: #CB1910;   --hot-fg: #FFFFFF;
  --warm-bg: #FFE76F;  --warm-fg: #191919;
  --nur-bg: #DCD9F7;   --nur-fg: #11103B;
  --cold-bg: #A7E1F5;  --cold-fg: #11103B;
  --chip-on-bg: #11103B; --chip-on-fg: #FAFBFB;
  --shadow: 3px 2px 9px 0 rgba(129, 114, 114, 0.5);
  --font-display: "Space Grotesk", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Manrope", "Verdana", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #191919; --surface: #2C2C31; --fg: #FAFBFB; --fg-muted: #e4e6e8; --fg-subtle: #c7ccd0;
    --line: rgba(250, 251, 251, 0.14); --hairline: #FAFBFB; --red: #EE2E24;
    --chip-on-bg: #FAFBFB; --chip-on-fg: #191919;
    --shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #191919; --surface: #2C2C31; --fg: #FAFBFB; --fg-muted: #e4e6e8; --fg-subtle: #c7ccd0;
  --line: rgba(250, 251, 251, 0.14); --hairline: #FAFBFB; --red: #EE2E24;
  --chip-on-bg: #FAFBFB; --chip-on-fg: #191919;
  --shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5; letter-spacing: 0.2px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 500; letter-spacing: -0.019px; margin: 0; text-wrap: balance; }
.material-icons { font-size: 20px; line-height: 1; vertical-align: middle; }
button, input, textarea, select { font: inherit; letter-spacing: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 2px solid var(--hairline); }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 12px; }
.mark { width: 28px; height: 28px; color: var(--red); flex: none; }
.top h1 { font-size: 20px; line-height: 1.1; }
.top .sub { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-subtle); }
.top .grow { flex: 1; min-width: 0; }
.crew { display: flex; align-items: center; }
.crew span {
  width: 30px; height: 30px; display: grid; place-items: center; margin-left: -6px;
  border: 2px solid var(--bg); background: var(--surface); box-shadow: var(--shadow);
  font-size: 11px; font-weight: 700;
}
.crew span.live { background: var(--red-solid); color: var(--on-red); }

.example {
  margin-top: 12px; padding: 8px 12px; font-size: 13px; color: var(--fg-subtle);
  border: 1px dashed var(--line);
}

/* Summary */
.tally { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }
.tally button {
  border: 0; background: var(--surface); box-shadow: var(--shadow); padding: 10px 8px; text-align: left;
  display: grid; gap: 2px; border-top: 4px solid transparent;
}
.tally button[aria-pressed="true"] { outline: 2px solid var(--hairline); outline-offset: -2px; }
.tally .n { font-family: var(--font-display); font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
.tally .l { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg-subtle); }
.tally [data-r="hot"] { border-top-color: var(--hot-bg); }
.tally [data-r="warm"] { border-top-color: var(--warm-bg); }
.tally [data-r="nurture"] { border-top-color: var(--nur-bg); }
.tally [data-r="cold"] { border-top-color: var(--cold-bg); }

.list-head { display: flex; align-items: baseline; justify-content: space-between; margin: 24px 0 8px; }
.list-head h2 { font-size: 18px; }
.linkish { background: none; border: 0; padding: 0; color: var(--fg-subtle); font-size: 13px; text-decoration: underline; }

/* Lead rows */
.leads { list-style: none; margin: 0; padding: 0 0 120px; display: grid; gap: 8px; }
.lead {
  width: 100%; border: 0; background: var(--surface); box-shadow: var(--shadow); text-align: left;
  padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px;
}
.lead .who { min-width: 0; }
.lead .name { font-family: var(--font-display); font-size: 17px; font-weight: 500; }
.lead .co { color: var(--fg-muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lead .meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--fg-subtle); }
.tag { padding: 2px 8px; background: var(--bg); border: 1px solid var(--line); font-size: 12px; }
.pill { padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; height: fit-content; }
.pill.hot { background: var(--hot-bg); color: var(--hot-fg); }
.pill.warm { background: var(--warm-bg); color: var(--warm-fg); }
.pill.nurture { background: var(--nur-bg); color: var(--nur-fg); }
.pill.cold { background: var(--cold-bg); color: var(--cold-fg); }
.empty { padding: 32px 16px; text-align: center; color: var(--fg-subtle); }

/* Fixed scan button */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding-top: 12px;
  background: linear-gradient(to top, var(--bg) 70%, transparent);
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; padding: 14px 18px; font-weight: 700; font-size: 16px;
  background: var(--red-solid); color: var(--on-red);
  transition: opacity 150ms ease-out;
}
.btn:hover { opacity: 0.85; }
.btn.block { width: 100%; }
.btn.ghost { background: transparent; color: var(--fg); border: 2px solid var(--hairline); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }

/* Full-screen views */
.view { position: fixed; inset: 0; z-index: 8; background: var(--bg); overflow-y: auto; padding-top: env(safe-area-inset-top, 0px); }
.view-bar { position: sticky; top: 0; background: var(--bg); border-bottom: 2px solid var(--hairline); z-index: 2; }
.view-bar .wrap { display: flex; align-items: center; gap: 8px; padding-block: 10px; }
.view-bar h2 { font-size: 18px; flex: 1; }
.icon-btn { border: 0; background: none; padding: 8px; margin-left: -8px; display: grid; place-items: center; }
.view-body { padding-block: 16px 140px; display: grid; gap: 20px; }

.photo {
  display: grid; place-items: center; gap: 8px; text-align: center; min-height: 180px;
  border: 2px dashed var(--line); background: var(--surface); padding: 16px; cursor: pointer;
}
.photo .material-icons { font-size: 40px; color: var(--red); }
.photo img { max-width: 100%; max-height: 220px; object-fit: contain; }
.photo input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.status { font-size: 13px; color: var(--fg-subtle); display: flex; gap: 6px; align-items: center; }

.section-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-subtle); margin-bottom: 8px; }
.fields { display: grid; gap: 10px; }
.field { display: grid; gap: 4px; }
.field label { font-size: 13px; font-weight: 600; color: var(--fg-muted); }
.field input, textarea {
  width: 100%; min-width: 0; padding: 11px 12px; background: var(--surface); border: 1px solid var(--line); border-bottom: 2px solid var(--hairline); border-radius: 0;
}
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.with-btn { display: flex; gap: 8px; }
.with-btn input { flex: 1; }
.find { border: 2px solid var(--hairline); background: none; padding: 0 12px; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.hint { font-size: 12px; color: var(--fg-subtle); }

.seg { display: grid; grid-template-columns: repeat(4, 1fr); border: 2px solid var(--hairline); }
.seg button { border: 0; background: var(--surface); padding: 12px 4px; font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"][data-r="hot"] { background: var(--hot-bg); color: var(--hot-fg); }
.seg button[aria-pressed="true"][data-r="warm"] { background: var(--warm-bg); color: var(--warm-fg); }
.seg button[aria-pressed="true"][data-r="nurture"] { background: var(--nur-bg); color: var(--nur-fg); }
.seg button[aria-pressed="true"][data-r="cold"] { background: var(--cold-bg); color: var(--cold-fg); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--hairline); background: var(--surface); padding: 9px 12px; font-size: 14px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--chip-on-bg); color: var(--chip-on-fg); }
textarea { min-height: 96px; resize: vertical; }

/* Detail */
.detail-head { display: grid; gap: 6px; }
.detail-head h3 { font-size: 28px; line-height: 1.1; }
.rule { width: min(428px, 100%); height: 2px; background: var(--hairline); border: 0; margin: 4px 0 0; }
.kv { display: grid; grid-template-columns: 92px 1fr; gap: 8px 12px; margin: 0; font-size: 14px; }
.kv dt { color: var(--fg-subtle); font-weight: 600; }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.note { background: var(--surface); box-shadow: var(--shadow); padding: 12px 14px; }
.note p { margin: 0; }
.actions { display: grid; gap: 8px; }
.soon { font-size: 12px; color: var(--fg-subtle); text-align: center; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 20;
  bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  background: var(--fg); color: var(--bg); padding: 10px 16px; font-weight: 600; font-size: 14px;
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin 900ms linear infinite; }
</style>

<script>
const RATINGS = [
  { id: "hot", label: "Hot" },
  { id: "warm", label: "Warm" },
  { id: "nurture", label: "Nurture" },
  { id: "cold", label: "Cold" },
];
const TAGS = [
  "Wants a demo", "Has a project now", "Decision maker", "Uses Salesforce",
  "Agentforce curious", "Mentioned a competitor", "Call after budget season", "Swag only",
];

// Example leads for the concept. The live app reads these from the shared database instead.
const leads = [
  { id: 1, name: "Dana Whitfield", title: "VP Revenue Operations", company: "Northwind Freight", email: "dana.whitfield@example.com", phone: "(555) 014-2290", social: "linkedin.com/in/example-dana", rating: "hot", tags: ["Wants a demo", "Decision maker", "Uses Salesforce"], notes: "Forecasts live in spreadsheets. Wants a demo next week, Tuesday or Wednesday.", by: "Jess", at: "10:42 AM" },
  { id: 2, name: "Priya Raman", title: "Salesforce Admin", company: "Lakeside Health", email: "priya.raman@example.com", phone: "", social: "", rating: "warm", tags: ["Agentforce curious", "Uses Salesforce"], notes: "Team of two admins. Curious about agents for intake, needs a business case first.", by: "You", at: "10:18 AM" },
  { id: 3, name: "Marcus Bell", title: "Director of IT", company: "Crestline Builders", email: "mbell@example.com", phone: "(555) 018-7731", social: "", rating: "nurture", tags: ["Call after budget season"], notes: "Call me after budget season. Planning closes in January.", by: "Marco", at: "9:55 AM" },
  { id: 4, name: "Alex Kim", title: "Student", company: "State University", email: "", phone: "", social: "", rating: "cold", tags: ["Swag only"], notes: "", by: "You", at: "9:31 AM" },
  { id: 5, name: "Hannah Ortiz", title: "COO", company: "Brightpath Credit Union", email: "hortiz@example.com", phone: "", social: "linkedin.com/in/example-hannah", rating: "hot", tags: ["Has a project now", "Mentioned a competitor"], notes: "Unhappy with current partner. RFP goes out in three weeks.", by: "Jess", at: "9:12 AM" },
];

// Example result for the concept. The live app asks Claude to read the photo.
const EXAMPLE_PARSE = { name: "Sam Okafor", title: "Head of Sales Ops", company: "Granite Peak Software", email: "sam.okafor@example.com", phone: "(555) 012-4408" };

let filter = null;
let draft = null;
let openId = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ratingLabel = (id) => RATINGS.find((r) => r.id === id)?.label ?? "Unrated";

function renderTally() {
  $("tally").innerHTML = RATINGS.map((r) => {
    const n = leads.filter((l) => l.rating === r.id).length;
    return `<button data-r="${r.id}" aria-pressed="${filter === r.id}"><span class="n">${n}</span><span class="l">${r.label}</span></button>`;
  }).join("");
}

function renderList() {
  const shown = filter ? leads.filter((l) => l.rating === filter) : leads;
  $("listTitle").textContent = filter ? `${ratingLabel(filter)} leads` : `All leads · ${leads.length}`;
  $("clearFilter").hidden = !filter;
  $("leads").innerHTML = shown.length ? shown.map((l) => `
    <li><button class="lead" data-id="${l.id}">
      <div class="who"><div class="name">${esc(l.name || "No name yet")}</div><div class="co">${esc([l.title, l.company].filter(Boolean).join(" · "))}</div></div>
      ${l.rating ? `<span class="pill ${l.rating}">${ratingLabel(l.rating)}</span>` : ""}
      <div class="meta">${l.tags.slice(0, 2).map((t) => `<span class="tag">${esc(t)}</span>`).join("")}${l.tags.length > 2 ? `<span>+${l.tags.length - 2}</span>` : ""}<span>Added by ${esc(l.by)} · ${esc(l.at)}</span></div>
    </button></li>`).join("")
    : `<li class="empty">No ${filter ? ratingLabel(filter).toLowerCase() + " " : ""}leads yet. Tap Scan to add the first one.</li>`;
}

function render() { renderTally(); renderList(); }

function show(view) {
  for (const v of ["capture", "detail"]) $(v).hidden = v !== view;
  document.body.style.overflow = view ? "hidden" : "";
}

// Capture
function openCapture() {
  draft = { rating: null, tags: new Set() };
  $("capForm").reset();
  $("photoBox").querySelector("img")?.remove();
  $("photoIcon").hidden = false;
  $("photoText").textContent = "Take a photo of the badge or card";
  $("photoHint").textContent = "Claude reads the name, title, company, and contact details.";
  $("readStatus").hidden = true;
  renderCaptureControls();
  show("capture");
  $("capture").scrollTop = 0;
}

function renderCaptureControls() {
  $("capRating").innerHTML = RATINGS.map((r) => `<button type="button" data-r="${r.id}" aria-pressed="${draft.rating === r.id}">${r.label}</button>`).join("");
  $("capTags").innerHTML = TAGS.map((t) => `<button type="button" class="chip" data-tag="${esc(t)}" aria-pressed="${draft.tags.has(t)}">${esc(t)}</button>`).join("");
}

$("photoInput").addEventListener("change", (e) => {
  const file = e.target.files?.[0];
  if (!file) return;
  const img = document.createElement("img");
  img.alt = "Badge photo";
  img.src = URL.createObjectURL(file);
  $("photoBox").querySelector("img")?.remove();
  $("photoBox").prepend(img);
  $("photoIcon").hidden = true;
  $("photoText").textContent = "Retake photo";
  $("photoHint").textContent = "";
  const st = $("readStatus");
  st.hidden = false;
  st.innerHTML = `<span class="material-icons spin">autorenew</span>Reading the badge…`;
  setTimeout(() => {
    for (const [k, v] of Object.entries(EXAMPLE_PARSE)) $("f-" + k).value = v;
    st.innerHTML = `<span class="material-icons">info</span>Example result. In the live app, Claude fills these from your photo. Check them before you save.`;
  }, 900);
});

$("capRating").addEventListener("click", (e) => {
  const b = e.target.closest("[data-r]");
  if (!b) return;
  draft.rating = draft.rating === b.dataset.r ? null : b.dataset.r;
  renderCaptureControls();
});
$("capTags").addEventListener("click", (e) => {
  const b = e.target.closest("[data-tag]");
  if (!b) return;
  const t = b.dataset.tag;
  draft.tags.has(t) ? draft.tags.delete(t) : draft.tags.add(t);
  b.setAttribute("aria-pressed", draft.tags.has(t));
});

$("capForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const v = (k) => $("f-" + k).value.trim();
  if (!v("name") && !v("company") && !v("email")) {
    toast("Add a name, company, or email first.");
    return;
  }
  const now = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  leads.unshift({
    id: Date.now(), name: v("name"), title: v("title"), company: v("company"), email: v("email"),
    phone: v("phone"), social: v("social"), rating: draft.rating, tags: [...draft.tags],
    notes: v("notes"), by: "You", at: now,
  });
  filter = null;
  show(null);
  render();
  toast("Lead saved");
});

// Detail
function openDetail(id) {
  const l = leads.find((x) => x.id === id);
  if (!l) return;
  openId = id;
  const rows = [["Email", l.email], ["Phone", l.phone], ["Socials", l.social]].filter(([, val]) => val);
  $("detailBody").innerHTML = `
    <div class="detail-head">
      ${l.rating ? `<span class="pill ${l.rating}" style="justify-self:start">${ratingLabel(l.rating)}</span>` : ""}
      <h3>${esc(l.name || "No name yet")}</h3>
      <div>${esc([l.title, l.company].filter(Boolean).join(" · "))}</div>
      <hr class="rule">
    </div>
    ${rows.length ? `<dl class="kv">${rows.map(([k, val]) => `<dt>${k}</dt><dd>${esc(val)}</dd>`).join("")}</dl>` : ""}
    ${l.tags.length ? `<div><div class="section-label">Quick tags</div><div class="chips">${l.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div></div>` : ""}
    <div><div class="section-label">Notes</div><div class="note"><p>${l.notes ? esc(l.notes) : "No notes yet."}</p></div></div>
    <div class="hint">Added by ${esc(l.by)} at ${esc(l.at)}</div>
    <div class="actions">
      <button class="btn ghost block" disabled><span class="material-icons">travel_explore</span>Research ${esc(l.company || "company")}</button>
      <button class="btn ghost block" disabled><span class="material-icons">send</span>Post to Slack</button>
      <div class="soon">These connect when we add the MCP server.</div>
    </div>`;
  show("detail");
  $("detail").scrollTop = 0;
}

let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.hidden = true), 2200);
}

$("tally").addEventListener("click", (e) => {
  const b = e.target.closest("[data-r]");
  if (!b) return;
  filter = filter === b.dataset.r ? null : b.dataset.r;
  render();
});
$("clearFilter").addEventListener("click", () => { filter = null; render(); });
$("leads").addEventListener("click", (e) => {
  const b = e.target.closest("[data-id]");
  if (b) openDetail(Number(b.dataset.id));
});
$("scanBtn").addEventListener("click", openCapture);
document.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", () => show(null)));

render();
</script>
