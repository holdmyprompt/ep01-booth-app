# Render Blueprint for the MCP server. The server code is written live on the stream.
services:
  - type: web
    name: ep01-mcp-server
    runtime: node
    rootDir: mcp-server
    plan: starter # paid plan, so the server does not sleep before air
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false # set the value in the Render dashboard, never in git
